[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.14"
edition = "2024"
rust-version = "1.97"
publish = true
license = "Apache-2.0"
repository = "https://github.com/Luolc/locode-core"
# Inherited path — cargo resolves it relative to the workspace root, so every
# crate's crates.io page renders the shared root README.
readme = "README.md"

# Shared dependency versions (referenced from crates via `<dep>.workspace = true`).
[workspace.dependencies]
# Internal crates: path for local builds, version for the published manifests
# (cargo strips `path` on publish, so a version is mandatory). Kept here so a
# release bumps every cross-crate requirement in one place.
locode-protocol = { path = "crates/locode-protocol", version = "0.1.14" }
locode-tools = { path = "crates/locode-tools", version = "0.1.14" }
locode-packs = { path = "crates/locode-packs", version = "0.1.14" }
locode-provider = { path = "crates/locode-provider", version = "0.1.14" }
locode-host = { path = "crates/locode-host", version = "0.1.14" }
locode-instructions = { path = "crates/locode-instructions", version = "0.1.14" }
locode-skills = { path = "crates/locode-skills", version = "0.1.14" }
locode-engine = { path = "crates/locode-engine", version = "0.1.14" }
locode-core = { path = "crates/locode-core", version = "0.1.14" }
locode-tui = { path = "crates/locode-tui", version = "0.1.14" }
locode-exec = { path = "crates/locode-exec", version = "0.1.14" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `SKILL.md` YAML frontmatter (ADR-0025 §2). codex and grok both parse it with a real
# YAML crate rather than a hand-rolled scanner; we follow that, but take the maintained
# drop-in fork — upstream `serde_yaml` is archived and publishes as `0.9.34+deprecated`.
serde_yaml_ng = "0.10"
# `instructions.root_stop_pattern` matching (ADR-0023 rule 2, activated by
# ADR-0024 §1.4 — the dependency was approved with that ADR's acceptance).
regex = "1"
# Async, object-safe tool traits (native `async fn` in traits isn't dyn-safe yet);
# matches the ADR-0003 `#[async_trait]` sketch and Grok Build's tool runtime.
async-trait = "0.1"
# JSON Schema derived from `Args` types (ADR-0003). v1 matches Grok Build.
schemars = "1"
# Error taxonomy (`ToolError`) and beyond; the SPEC tech stack. v2 matches both refs.
thiserror = "2"
# `CancellationToken` for cooperative cancellation — the exact type Codex and Grok use.
tokio-util = "0.7"
# Async runtime; feature sets are opted in per crate (e.g. dev-only `macros`/`rt`).
tokio = { version = "1" }
# Safe wrappers for `killpg`/signals so the host can group-kill without `unsafe`
# (the `unsafe` stays inside `nix`, which `forbid(unsafe_code)` does not police).
nix = { version = "0.29", features = ["signal", "process"] }
# Real temp workspace trees for host/jail tests (dev-only).
tempfile = "3"
# Gitignore-aware traversal + single-path ignore checks in the host seam
# (Task 26 Slice 0; grok's list_dir walker and GitignoreFilter both use it).
# Approved as a host-only dependency in the 2026-07-21 plan interview.
ignore = "0.4"
# Backoff jitter for the wire's transport retry (codex retry.rs precedent).
rand = "0.9"
# Prompt-template rendering — grok's own renderer with its custom `${{ }}` syntax
# (xai-grok-tools/Cargo.toml:41); the faithful choice for the grok pack (Task 13).
minijinja = { version = "2", features = ["custom_syntax"] }
# The CLI parser for locode-exec (SPEC tech stack; codex-exec precedent). `env` for
# LOCODE_API_SCHEMA; derive for the args struct + ValueEnum + exit-2 usage errors.
clap = { version = "4", features = ["derive", "env"] }
# stderr structured logging for the binary (ADR-0009; codex-exec precedent).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Local-date stamp for the pack preamble (grok uses chrono::Local, Task 13/14).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Drive the built binary in locode-exec's integration tests (dev-only).
assert_cmd = "2"
predicates = "3"
# The one HTTP client; rustls avoids the system OpenSSL dep (SPEC, ADR-0007).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2", "stream"] }
# Stream combinators (`StreamExt::next`) to consume `reqwest::Response::bytes_stream`
# for SSE (ADR-0021). Tokio-family; user-approved 2026-07-23.
tokio-stream = "0.1"
# ---- TUI workstream deps (SPEC-TUI, approved with the spec 2026-07-21) ----
# Terminal UI framework + backend — stock crates, no forks (SPEC-TUI: our v1
# uses Viewport::Inline + insert_before, not the forked scrolling-region path).
# `scrolling-regions`: insert_before via DECSTBM scroll regions — the only
# inline-history path with NO cursor-position query (a CPR query deadlocks
# against the dedicated input-reader thread; found in the slice-2 smoke).
ratatui = { version = "0.29", features = ["scrolling-regions"] }
crossterm = { version = "0.28", features = ["bracketed-paste"] }
# Terminal display width (East-Asian/CJK = 2 cells, emoji = 2, zero-width = 0) for
# wide-char-correct wrapping. Same crate + pin the codex/grok-build TUIs use; already
# in the tree via ratatui.
unicode-width = "0.2"
# Multiline composer widget (grok forked one; the stock crate suffices for v1
# behind our own Composer wrapper).
tui-textarea = "0.7"
# Fuzzy matching + match indices for the slash-command menu (ADR-0026's approved
# `nucleo` dependency). We take **`nucleo-matcher`**, the matcher crate of the same
# Helix project, rather than the `nucleo` umbrella: the umbrella adds a threaded
# multi-pattern search engine (rayon + parking_lot) built for streaming millions of
# candidates, and our menu ranks a handful of command names per keystroke. Same
# algorithm and the same `indices()` that drive the highlighted letters — grok's
# `slash/matcher.rs` uses exactly those two calls.
nucleo-matcher = "0.3"
# Assistant markdown -> styled lines (no syntect in v1).
pulldown-cmark = { version = "0.13", default-features = false }
# Code-block syntax highlighting for the TUI markdown renderer (markdown study
# Phase 1, docs/research/markdown-rendering-study.md). Both Rust/ratatui
# references (codex, grok) use this exact stack: syntect + two-face (bat's
# ~250-language grammar + theme bundles). We select the pure-Rust fancy-regex
# engine — NOT oniguruma (C) as codex does — because this is our own app UI (not
# a ported pack, so the fidelity rule doesn't force onig) and a C dependency
# would complicate the fully-static musl release (the repo is rustls/OpenSSL-free
# by design, ADR-0007).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = [
    "syntect-default-fancy",
] }

# Strict-from-empty: these are enabled now, while the crates are empty, so we never pay
# the churn of adding lints after code exists. See ADR-0010.
[workspace.lints.rust]
unsafe_code = "forbid"       # this project needs no `unsafe`
unused_must_use = "deny"
missing_docs = "warn"        # every public item needs a doc comment
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"         # allowed in tests via clippy.toml
expect_used = "deny"         # allowed in tests via clippy.toml
dbg_macro = "deny"
# stdout is reserved for the one JSON report; stderr for diagnostics from the binary
# only. Deny both workspace-wide so no library crate can print by accident; `locode-exec`
# adds narrow `#[allow]` on its report/stream/stderr writers (ADR-0009).
print_stdout = "deny"
print_stderr = "deny"
