name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Every main commit needs a result of its own, so each one gets its own
  # group: a shared group would cancel a pending run when a newer one
  # arrives. On a PR branch, a newer push cancels the older run.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists the commits of the PR

jobs:
  rust:
    name: fmt · clippy · test · doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks-action scans the commits of the push or PR

      # Scans the commits of this PR or push, in the required job so a finding
      # blocks the merge; gitleaks.yml scans the whole history weekly.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The rev of the hook in .pre-commit-config.yaml; change both together.
          GITLEAKS_VERSION: 8.30.1
          # Commenting on the PR would need pull-requests: write; the job log
          # and summary show the finding.
          GITLEAKS_ENABLE_COMMENTS: false

      # Keep the toolchain in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (warnings = errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Docs (broken links = errors)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
