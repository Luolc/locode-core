# Release artifacts (ADR-0010 amendments 2026-07-21): on a version tag, build
# locode-exec binaries — fully static musl for Linux, native for macOS — and
# attach them to a GitHub Release. The crates.io publish stays agent-driven;
# this workflow only covers binary artifacts. Static musl linking works
# because the workspace is OpenSSL-free by design (rustls — SPEC/ADR-0007).
# install.sh (repo root) consumes these assets by exact name.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Linux only: musl cross toolchain. The apple targets build natively on
      # the macOS runner (upload-rust-binary-action installs the rust target).
      - uses: taiki-e/setup-cross-toolchain-action@v1
        if: startsWith(matrix.os, 'ubuntu')
        with:
          target: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: locode-exec
          target: ${{ matrix.target }}
          tar: unix
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
