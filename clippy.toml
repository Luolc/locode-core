# Project clippy configuration — see ADR-0010.

# `unwrap`/`expect` are denied in library code (Cargo.toml workspace lints) but
# allowed in tests, where a panic is a perfectly good failure signal.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Proper nouns that trip `doc_markdown` (pedantic) but shouldn't be rendered as code.
# `..` extends clippy's built-in valid-idents list rather than replacing it.
doc-valid-idents = ["OpenAI", "OpenRouter", ".."]
