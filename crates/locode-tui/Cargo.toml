[package]
name = "locode-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Not published until v1 stabilizes (SPEC-TUI; flipping later is non-breaking).
publish = false
description = "Terminal UI components and runnable app for the locode coding agent"
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
locode-core = { workspace = true }
# Skill-backed slash commands read and assemble a `SKILL.md` (ADR-0026 §4).
locode-skills = { workspace = true }
# The headless one-shot engine, reused by `locode -p` (Task 28). `locode-exec`
# stays a standalone library (NOT collapsed into this crate) so headless-only
# consumers can depend on it without pulling in the TUI (ADR-0019 amendment
# 2026-07-23).
locode-exec = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }
tui-textarea = { workspace = true }
async-trait = { workspace = true }
pulldown-cmark = { workspace = true }
syntect = { workspace = true }
two-face = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
tempfile = { workspace = true }
