[package]
name = "locode-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Not published until v1 stabilizes (SPEC-TUI; flipping later is non-breaking).
publish = false
description = "Terminal UI components and runnable app for the locode coding agent"
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
locode-core = { workspace = true }
# The headless one-shot engine, reused by `locode -p` (Task 28). To be
# retired with locode-exec; this logic then migrates here (ADR-0019 amendment).
locode-exec = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
tui-textarea = { workspace = true }
async-trait = { workspace = true }
pulldown-cmark = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
tempfile = { workspace = true }
