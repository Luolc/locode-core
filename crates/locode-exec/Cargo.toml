[package]
name = "locode-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Minimal headless runner for the locode agent engine - one JSON report on stdout"
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
locode-core = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# No dev-dependencies: `locode-exec` is a library only (its binary was removed
# 2026-07-23, ADR-0019 amendment). The headless CLI is exercised end-to-end against
# the shipped `locode` binary in `locode-app/tests/cli.rs`.
